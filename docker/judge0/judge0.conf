################################################################################
# Judge0 Community Edition Configuration
# CODEGUARD Isolated Execution Infrastructure
################################################################################

# Server Access
ALLOW_ORIGIN=*
DISALLOW_ORIGIN=
ALLOW_IP=
DISALLOW_IP=

# Authentication (Default disabled for internal Docker network; enable via env in prod)
AUTHN_HEADER=X-Auth-Token
AUTHN_TOKEN=

# Redis Configuration (Overridden by environment variables in Docker)
REDIS_HOST=judge0_redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0_redis_pass

# PostgreSQL Configuration (Overridden by environment variables in Docker)
POSTGRES_HOST=judge0_db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0_secure_password

# Submission Resource & Execution Policy
# Default CPU limit 2 seconds, maximum ceiling 15 seconds
CPU_TIME_LIMIT=2.0
MAX_CPU_TIME_LIMIT=15.0
CPU_EXTRA_TIME=0.5
MAX_CPU_EXTRA_TIME=2.0

# Wall clock time limit
WALL_TIME_LIMIT=10.0
MAX_WALL_TIME_LIMIT=20.0

# Memory limits (in KB) - 256MB default, 512MB max
MEMORY_LIMIT=262144
MAX_MEMORY_LIMIT=524288

# Stack limits (in KB)
STACK_LIMIT=65536
MAX_STACK_LIMIT=131072

# Process / thread limits (prevent fork bombs)
MAX_PROCESSES_AND_OR_THREADS=60
MAX_MAX_PROCESSES_AND_OR_THREADS=120

# Output / file limits (4MB max)
MAX_FILE_SIZE=4096
MAX_MAX_FILE_SIZE=4096

# Network Isolation - Submissions must NOT access host or external networks
ALLOW_ENABLE_NETWORK=false
ENABLE_NETWORK=false

# Number of runs per submission
NUMBER_OF_RUNS=1
MAX_NUMBER_OF_RUNS=5

# Rails Server
RAILS_ENV=production
RAILS_MAX_THREADS=16
RAILS_SERVER_PROCESSES=2
