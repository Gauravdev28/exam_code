name: Backend CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'backend/**'

jobs:
  test:
    name: Django Tests & Quality Check
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_secure_password
          MYSQL_DATABASE: codeguard_test_db
          MYSQL_USER: codeguard_user
          MYSQL_PASSWORD: codeguard_secure_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Configure MySQL Test Database Privileges
        run: |
          python - << 'EOF'
          import pymysql
          import time

          for attempt in range(10):
              try:
                  conn = pymysql.connect(
                      host='127.0.0.1',
                      port=3306,
                      user='root',
                      password='root_secure_password',
                      connect_timeout=5
                  )
                  with conn.cursor() as cur:
                      cur.execute("GRANT ALL PRIVILEGES ON `test_%`.* TO 'codeguard_user'@'%';")
                      cur.execute("FLUSH PRIVILEGES;")
                  conn.close()
                  print("Successfully granted test_% database privileges to codeguard_user")
                  break
              except Exception as e:
                  if attempt == 9:
                      raise
                  print(f"Waiting for MySQL to be ready... ({e})")
                  time.sleep(2)
          EOF

      - name: Run Pytest Suite
        env:
          DJANGO_SETTINGS_MODULE: codeguard.settings.test
          DB_ENGINE: django.db.backends.mysql
          DB_NAME: codeguard_test_db
          DB_USER: codeguard_user
          DB_PASSWORD: codeguard_secure_password
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          USE_SQLITE_DEV: False
          REDIS_URL: redis://127.0.0.1:6379/0
          SECRET_KEY: test-ci-secret-key-codeguard-platform-2026
        run: |
          cd backend
          pytest -v --tb=short
