services:
  db:
    image: mysql:8.0
    container_name: codeguard_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secure_password
      MYSQL_DATABASE: codeguard_db
      MYSQL_USER: codeguard_user
      MYSQL_PASSWORD: codeguard_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "codeguard_user", "-pcodeguard_secure_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeguard_network

  redis:
    image: redis:7-alpine
    container_name: codeguard_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeguard_network

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: codeguard_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=codeguard.settings.development
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - USE_SQLITE_DEV=False
      - JUDGE0_URL=http://judge0:2358
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0:
        condition: service_started
    networks:
      - codeguard_network

  celery_worker:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: codeguard_celery_worker
    restart: unless-stopped
    command: celery -A codeguard worker --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    environment:
      - DJANGO_SETTINGS_MODULE=codeguard.settings.development
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - USE_SQLITE_DEV=False
      - JUDGE0_URL=http://judge0:2358
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge0:
        condition: service_started
    networks:
      - codeguard_network

  celery_beat:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: codeguard_celery_beat
    restart: unless-stopped
    command: celery -A codeguard beat --loglevel=info
    volumes:
      - ./backend:/app/backend
      - ./.env:/app/.env
    environment:
      - DJANGO_SETTINGS_MODULE=codeguard.settings.development
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - USE_SQLITE_DEV=False
      - JUDGE0_URL=http://judge0:2358
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codeguard_network

  # ----------------------------------------------------------------------------
  # Judge0 Community Edition (Isolated Execution Stack)
  # ----------------------------------------------------------------------------
  judge0_db:
    image: postgres:16-alpine
    container_name: codeguard_judge0_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: ${JUDGE0_POSTGRES_PASSWORD:-judge0_secure_password}
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeguard_network

  judge0_redis:
    image: redis:7-alpine
    container_name: codeguard_judge0_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--requirepass", "${JUDGE0_REDIS_PASSWORD:-judge0_redis_pass}"]
    volumes:
      - judge0_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${JUDGE0_REDIS_PASSWORD:-judge0_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeguard_network

  judge0:
    image: judge0/judge0:1.13.1
    container_name: codeguard_judge0
    restart: unless-stopped
    volumes:
      - ./docker/judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    environment:
      - REDIS_HOST=judge0_redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${JUDGE0_REDIS_PASSWORD:-judge0_redis_pass}
      - POSTGRES_HOST=judge0_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=${JUDGE0_POSTGRES_PASSWORD:-judge0_secure_password}
      - POSTGRES_DB=judge0
    depends_on:
      judge0_db:
        condition: service_healthy
      judge0_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2358/system_info"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codeguard_network

  judge0_workers:
    image: judge0/judge0:1.13.1
    container_name: codeguard_judge0_workers
    restart: unless-stopped
    command: ["./scripts/workers"]
    volumes:
      - ./docker/judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    environment:
      - REDIS_HOST=judge0_redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${JUDGE0_REDIS_PASSWORD:-judge0_redis_pass}
      - POSTGRES_HOST=judge0_db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=judge0
      - POSTGRES_PASSWORD=${JUDGE0_POSTGRES_PASSWORD:-judge0_secure_password}
      - POSTGRES_DB=judge0
    depends_on:
      judge0:
        condition: service_started
      judge0_db:
        condition: service_healthy
      judge0_redis:
        condition: service_healthy
    networks:
      - codeguard_network

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: codeguard_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_WS_BASE_URL=ws://localhost:8000/ws
    depends_on:
      - backend
    networks:
      - codeguard_network

volumes:
  mysql_data:
  redis_data:
  judge0_db_data:
  judge0_redis_data:

networks:
  codeguard_network:
    driver: bridge
